{% extends "base.html" %}
{% block title %}Prijava - Mali e-Dnevnik{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-12 col-sm-8 col-md-5 col-lg-4">
        <h1 class="h3 mb-4 text-center">Mali e-Dnevnik</h1>
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% if form.non_field_errors %}
                        <div class="alert alert-danger">{{ form.non_field_errors }}</div>
                    {% endif %}
                    <div class="mb-3">
                        <label class="form-label">{{ form.username.label }}</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ form.password.label }}</label>
                        {{ form.password }}
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg-block">Prijava</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
