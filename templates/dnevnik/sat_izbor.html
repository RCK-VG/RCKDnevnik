{% extends "base.html" %}
{% block title %}Novi sat{% endblock %}
{% block content %}
<h1 class="h5 mb-3">Novi sat</h1>
<form method="get" action="{% url 'otvori_sat' %}" class="card card-body">
    <div class="mb-3">
        <label class="form-label">{{ form.razred.label }}</label>
        {{ form.razred }}
    </div>
    <div class="mb-3">
        <label class="form-label">{{ form.predmet.label }}</label>
        {{ form.predmet }}
    </div>
    <div class="mb-3">
        <label class="form-label">{{ form.datum.label }}</label>
        {{ form.datum }}
    </div>
    <div class="mb-3">
        <label class="form-label">{{ form.grupa.label }}</label>
        {{ form.grupa }}
        <div class="form-text">Odaberi samo ako se ovaj sat drži po grupama (npr. praktikum).</div>
    </div>
    <button type="submit" class="btn btn-primary btn-lg-block">Otvori sat</button>
</form>
{% endblock %}
