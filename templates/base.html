<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mali e-Dnevnik{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.12"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <style>
        body { padding-bottom: 4rem; background-color: #f6f7f9; }
        .badge-ip { background-color: #0d6efd; }
        .badge-pp { background-color: #6f42c1; }
        .navbar-brand { font-weight: 600; }
        .btn-lg-block { width: 100%; padding: 1rem; font-size: 1.2rem; }
        /* Make plain Django-rendered form widgets look like Bootstrap inputs
           without adding a template-tag dependency (django-widget-tweaks). */
        input[type=text], input[type=password], input[type=date], input[type=file],
        input[type=number], input[type=email], select, textarea {
            display: block; width: 100%; padding: 0.5rem 0.75rem;
            border: 1px solid #ced4da; border-radius: 0.375rem; font-size: 1rem;
        }
        [x-cloak] { display: none !important; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% if user.is_authenticated %}
    <nav class="navbar navbar-dark bg-dark mb-3">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'pocetna' %}">Mali e-Dnevnik</a>
            <div class="d-flex align-items-center gap-3">
                <span class="text-light small">{{ user.get_full_name|default:user.username }}</span>
                <form method="post" action="{% url 'odjava' %}" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Odjava</button>
                </form>
            </div>
        </div>
    </nav>
    {% endif %}

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
