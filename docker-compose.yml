# Varijanta A: lokalno u skolskoj mrezi (bez domene, pristup preko IP adrese).
# Pokretanje: docker compose up -d --build
#
# Ako na istom uredaju vec radi neki drugi program, promijenite BROJ ISPRED
# dvotocke ("host port") u nesto slobodno, npr. "8080:8000" - aplikacija ce
# tada biti dostupna na http://<IP-adresa>:8080. Broj IZA dvotocke (8000)
# ostaje isti jer je to port unutar samog kontejnera.
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      # Datoteke klijenta za automatsko azuriranje racunala (samo citanje).
      # Nakon "git pull" racunala povuku nove skripte sama, bez USB-a.
      - ./klijent:/app/klijent:ro

  backup:
    build: .
    restart: unless-stopped
    env_file: .env
    entrypoint: []
    # Dnevno: sigurnosna kopija baze + osvježavanje popisa reklamnih domena
    # (reklamne_domene.txt) koji računala povuku auto-updateom.
    command: sh -c "while true; do python manage.py backup_db; python manage.py nadzor_reklame || true; sleep 86400; done"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      # Zapis u ./klijent (rw) da upiše reklamne_domene.txt; web ga čita (ro).
      - ./klijent:/app/klijent

  # HTTPS za ucenicka racunala (nadzor, klijent/): https://<NADZOR_HOST>:8443
  # s internim certifikatom. Nastavnici i dalje mogu koristiti http://<IP>:8080.
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile.lan:/etc/caddy/Caddyfile
      - caddy_lan_data:/data
      - caddy_lan_config:/config
    depends_on:
      - web

volumes:
  caddy_lan_data:
  caddy_lan_config:
